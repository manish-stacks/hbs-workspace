# Deploy on version tags (git tag v1.0.0 && git push --tags). Requires repo secrets: AWS_ROLE_ARN, AWS_REGION, ECR_REGISTRY, EC2_HOST, EC2_USER, EC2_SSH_KEY
name: Deploy
on: { push: { tags: ["v*"] } }
permissions: { id-token: write, contents: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ secrets.AWS_ROLE_ARN }}", aws-region: "${{ secrets.AWS_REGION }}" }
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build & push images
        run: |
          TAG=${GITHUB_REF_NAME}
          docker build -f apps/api/Dockerfile -t ${{ secrets.ECR_REGISTRY }}/hbs-api:$TAG .
          docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=/api -t ${{ secrets.ECR_REGISTRY }}/hbs-web:$TAG .
          docker push ${{ secrets.ECR_REGISTRY }}/hbs-api:$TAG && docker push ${{ secrets.ECR_REGISTRY }}/hbs-web:$TAG
      - name: Roll out on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/hbs && sed -i "s/^TAG=.*/TAG=${{ github.ref_name }}/" .env
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml run --rm migrate
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            sleep 15 && curl -fsS https://$(grep ^DOMAIN= .env | cut -d= -f2)/api/health
