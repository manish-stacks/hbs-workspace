# Single-host production stack (EC2). Database = AWS RDS (not in this file).
services:
  api:
    image: ${REGISTRY}/hbs-api:${TAG}
    restart: unless-stopped
    env_file: .env
    depends_on: [redis]
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 30s, timeout: 5s, retries: 3, start_period: 20s }
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }
  web:
    image: ${REGISTRY}/hbs-web:${TAG}
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    depends_on: [api, web]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes:
      - ./infrastructure/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot-webroot:/var/www/certbot
  # one-off:  docker compose -f docker-compose.prod.yml run --rm migrate
  migrate:
    image: ${REGISTRY}/hbs-api:${TAG}
    profiles: ["tools"]
    env_file: .env
    working_dir: /app/apps/api
    user: root
    command: ["sh", "-c", "npx prisma migrate deploy && npx ts-node prisma/seed.ts"]
volumes: { redis-data: {} }
